
# Create the network so that our containers can talk to eachother
networks:
    redis:
      name: redis_net
      driver: bridge

# Create the storage volume for redis
volumes: 
    redis_storage:
        name: redis_storage

# Define our containers
services:

    # Define redis properties
    cache:
        image: 'valkey/valkey:8-alpine'
        volumes: 
            - redis_storage:/data
        networks:
            - redis

    # Define python app properties, have it build our image
    app:
        build: 
            context: .
        networks: 
            - redis
        environment: 
            REDIS_HOST: cache
        entrypoint: "/bin/sh"
        tty: true
        develop:
            watch:
                - action: sync
                  path: .
                  target: /app
                - action: rebuild
                  path: requirements.txt
        healthcheck:
            test: ["CMD", "python", "redis_client.py", "check_redis"] 
            interval: 3s
