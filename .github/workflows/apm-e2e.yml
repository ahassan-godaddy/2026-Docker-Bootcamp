name: APM E2E

on:
  pull_request:
    branches:
      - 2026
      - 2025
  push:
    branches:
      - 2026

concurrency:
  group: apm-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apm-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Django secrets
        run: |
          cp django_app_for_part_2/Django/secrets/postgres_password.example.txt \
            django_app_for_part_2/Django/secrets/postgres_password.txt
          chmod 600 django_app_for_part_2/Django/secrets/postgres_password.txt

      - name: Run APM E2E test
        run: bash scripts/test-apm-e2e.sh

      - name: Teardown stacks
        if: always()
        run: |
          cd django_app_for_part_2/Django
          docker compose -f docker-compose.yml -f docker-compose.otel.yml down -v || true
          cd ../ELK
          docker compose --profile monitoring --profile ui down -v || true
