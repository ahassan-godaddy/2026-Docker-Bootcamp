filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: true
      hints.default_config.enabled: false

processors:
- add_docker_metadata: ~

# Beats config substitution uses ${VAR:default} (single colon) — distinct from
# the docker-compose ${VAR:-default} syntax you'll see in docker-compose.yml.
output.elasticsearch:
  hosts: ['elasticsearch:9200']
  username: elastic
  password: ${ELASTIC_PASSWORD:bootcamp-elastic}
