# Adapted from: https://github.com/docker/awesome-compose/tree/master/elasticsearch-logstash-kibana

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.3.3}
    container_name: es
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: true
      xpack.security.http.ssl.enabled: false
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-bootcamp-elastic}
    volumes:
      - esdata:/usr/share/elasticsearch/data/
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --silent --fail -u elastic:${ELASTIC_PASSWORD:-bootcamp-elastic} localhost:9200/_cluster/health || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    networks:
      - elastic

  filebeat:
    container_name: filebeat
    hostname: filebeat
    user: root
    image: docker.elastic.co/beats/filebeat:${STACK_VERSION:-9.3.3}
    profiles: ["monitoring"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-bootcamp-elastic}
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./configs/filebeat.yml:/usr/share/filebeat/filebeat.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - fbdata:/usr/share/filebeat/data/
    networks:
      - elastic
    command: filebeat -e --strict.perms=false
    restart: on-failure
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-9.3.3}
    container_name: kib
    profiles: ["ui"]
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      ELASTICSEARCH_SERVICEACCOUNTTOKEN: ${KIBANA_SERVICE_ACCOUNT_TOKEN}
    healthcheck:
      test: [ "CMD", "curl", "--silent", "--fail", "http://kibana:5601/" ]
      retries: 10
      interval: 10s
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '2m'
        max-file: '5'
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elastic

  apm-server:
    image: docker.elastic.co/apm/apm-server:${STACK_VERSION:-9.3.3}
    profiles: ["monitoring"]
    entrypoint:
      - /bin/sh
      - -c
      - |
        exec /usr/share/apm-server/apm-server -e \
          -E apm-server.rum.enabled=true \
          -E apm-server.host=0.0.0.0:8200 \
          -E output.elasticsearch.hosts='["http://elasticsearch:9200"]' \
          -E output.elasticsearch.username=elastic \
          -E output.elasticsearch.password="${ELASTIC_PASSWORD:-bootcamp-elastic}"
    ports:
      - "127.0.0.1:${APM_SERVER_PORT:-8200}:8200"
      - "127.0.0.1:${APM_SERVER_MONITOR_PORT:-6060}:6060"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    logging:
      driver: 'json-file'
      options:
        max-size: '2m'
        max-file: '5'
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "--silent", "--fail", "http://apm-server:8200/" ]
      retries: 10
      interval: 10s
    networks:
      - elastic

networks:
  elastic:
    driver: bridge

volumes:
  esdata:
    driver: local
  fbdata:
    driver: local
