services:
  db:
    image: postgres:17-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      co.elastic.logs/enabled: true
  cache:
    # The same Valkey image we used in Part 1. The /ask endpoint uses it to
    # cache LLM answers so repeated questions are instant.
    image: valkey/valkey:8-alpine
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build: .
    labels:
      co.elastic.logs/enabled: true
      co.elastic.logs/json.keys_under_root: true
      co.elastic.logs/json.add_error_key: true
      co.elastic.logs/json.message_key: message
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      OTEL_SERVICE_NAME: bootcamp-django
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      # Local LLM (Docker Model Runner). The /ask endpoint proxies to this.
      LLM_BASE_URL: "http://model-runner.docker.internal/engines/v1"
      LLM_MODEL: "ai/smollm2"
      # Valkey cache used by the /ask endpoint.
      CACHE_HOST: "cache"
      CACHE_PORT: "6379"
    develop:
      watch:
        - action: sync
          path: .
          target: /code
        - action: rebuild
          path: requirements.txt
    ports:
      - "8000:8000"
    secrets:
      - postgres_password
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

volumes:
  pgdata:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
